<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BasicClickBot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a4e 50%, #4a1a6b 100%);
      background-attachment: fixed;
    }

    .container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 50px;
      padding: 20px;
    }

    .counter {
      font-size: 96px;
      font-weight: 700;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
      transition: transform 0.15s ease;
    }

    .counter.bump {
      transform: scale(1.15);
    }

    .btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 40px rgba(168, 85, 247, 0.5);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active {
      transform: scale(0.94);
      box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="counter" id="counter">0</div>
    <button class="btn" id="tapBtn">Нажми</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const counterEl = document.getElementById('counter');
    const btn = document.getElementById('tapBtn');

    let count = 0;

    if (tg?.CloudStorage) {
      tg.CloudStorage.getItem('tap_count', (err, value) => {
        if (!err && value) {
          count = parseInt(value, 10) || 0;
          counterEl.textContent = count;
        }
      });
    }

    btn.addEventListener('click', () => {
      count++;
      counterEl.textContent = count;

      counterEl.classList.add('bump');
      setTimeout(() => counterEl.classList.remove('bump'), 150);

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      if (tg?.CloudStorage) {
        tg.CloudStorage.setItem('tap_count', String(count));
      }
    });
  </script>
</body>
</html>
