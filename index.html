<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BasicClickBot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- ============================================================
       СТИЛИ
       ============================================================ -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- CSS-переменные (по умолчанию — классика) ---------- */
    :root {
      --accent-color: #a855f7;
      --accent-color-soft: rgba(168, 85, 247, 0.3);
      --accent-color-border: rgba(168, 85, 247, 0.3);
      --accent-color-glow: rgba(168, 85, 247, 0.6);
      --accent-color-bg: rgba(168, 85, 247, 0.15);
      --btn-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --btn-shadow: rgba(168, 85, 247, 0.5);
      --panel-bg: rgba(10, 14, 39, 0.75);
      --panel-border: rgba(168, 85, 247, 0.3);
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a4e 50%, #4a1a6b 100%);
      background-attachment: fixed;
      overflow: hidden;
    }

    /* ---------- Бейдж множителя ---------- */
    .multiplier-badge {
      grid-row: 1;
      align-self: end;
      margin-bottom: 8px;
      padding: 6px 16px;
      background: var(--btn-gradient);
      color: #ffffff;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 15px var(--accent-color-soft);
      animation: pulseBadge 1.5s ease-in-out infinite;
    }

    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }
    
    /* ---------- Canvas для частиц ---------- */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ---------- Верхние вкладки ---------- */
    .tabs {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--panel-border);
      z-index: 100;
    }

    .tab {
      flex: 1;
      padding: 16px 8px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s ease;
      position: relative;
      font-family: inherit;
    }

    .tab.active { color: #ffffff; }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      background: var(--btn-gradient);
      border-radius: 3px 3px 0 0;
    }

    /* ---------- Экраны ---------- */
    .screen {
      display: none;
      position: absolute;
      top: 56px;
      left: 0;
      right: 0;
      bottom: 70px;
      z-index: 50;
    }

    .screen.active { display: block; }

    /* ---------- Экран кликера ---------- */
    #screen-clicker .container {
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      height: 100%;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
      z-index: 60;
    }

    .counter {
      grid-row: 1;
      align-self: end;
      font-size: 96px;
      font-weight: 700;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 30px var(--accent-color-glow);
      transition: transform 0.15s ease;
      margin-bottom: 40px;
    }

    .counter.bump { transform: scale(1.15); }

    .btn {
      grid-row: 2;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      background: var(--btn-gradient);
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 40px var(--btn-shadow);
      transition: transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      position: relative;
      z-index: 60;
    }

    .btn:active { transform: scale(0.94); }

    /* ---------- Экран лидерборда ---------- */
    #screen-leaderboard {
      overflow-y: auto;
      padding: 16px;
    }

    .leaderboard-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--accent-color);
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--accent-color-border);
      border-radius: 14px;
    }

    .leaderboard-item.me {
      background: var(--accent-color-bg);
      border-color: var(--accent-color-glow);
    }

    .rank {
      font-size: 20px;
      font-weight: 700;
      width: 40px;
      text-align: center;
      flex-shrink: 0;
    }

    .rank.gold   { color: #ffd700; }
    .rank.silver { color: #c0c0c0; }
    .rank.bronze { color: #cd7f32; }

    .player-name {
      flex: 1;
      margin-left: 12px;
      font-size: 15px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-score {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-color);
      flex-shrink: 0;
    }

    .loading, .empty {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 15px;
    }

    /* ---------- Экран магазина ---------- */
    #screen-shop {
      overflow-y: auto;
      padding: 16px;
    }

    /* Под-вкладки магазина */
    .shop-subtabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 4px;
    }

    .shop-subtab {
      flex: 1;
      padding: 10px 12px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border-radius: 10px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .shop-subtab.active {
      color: #ffffff;
      background: var(--btn-gradient);
      box-shadow: 0 4px 15px var(--accent-color-soft);
    }

    /* Сетка товаров 2×N */
    .shop-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .shop-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--accent-color-border);
      border-radius: 18px;
      aspect-ratio: 1 / 1;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      text-align: center;
      transition: transform 0.15s ease;
    }

    .shop-item:active { transform: scale(0.97); }

    .shop-item-active {
      background: var(--accent-color-bg);
      border: 2px solid var(--accent-color-glow);
      box-shadow: 0 0 20px var(--accent-color-soft);
    }

    .shop-item-active::after {
      content: '✓';
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--accent-color);
      color: #ffffff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .shop-item-icon {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .shop-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      justify-content: center;
      width: 100%;
      min-width: 0;
    }

    .shop-item-name {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shop-item-desc {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shop-item-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-color);
      margin: 6px 0 4px;
    }

    .shop-buy-btn {
      background: var(--btn-gradient);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    .shop-buy-btn:active { transform: scale(0.95); }

    .shop-buy-btn:disabled {
      background: rgba(255, 255, 255, 0.15);
      cursor: default;
      opacity: 0.7;
    }

    /* Растягиваем последний товар, если он один в строке */
    .shop-list > .shop-item:last-child:nth-child(odd) {
      grid-column: span 2;
      aspect-ratio: auto;
      min-height: 160px;
    }

    /* ---------- Нижняя панель ---------- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--panel-border);
      padding: 10px 0;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 200;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 12px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .nav-btn:active {
      background: var(--accent-color-bg);
      color: #ffffff;
    }

    .nav-btn .icon { font-size: 22px; line-height: 1; }

    /* ---------- @keyframes для радуги ---------- */
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       HTML СТРУКТУРА
       ============================================================ -->

  <canvas id="particles"></canvas>

  <!-- Верхние вкладки -->
    <div class="tabs">
    <button class="tab" data-screen="shop">🛒 Магазин</button>
    <button class="tab active" data-screen="clicker">🎯 Кликер</button>
    <button class="tab" data-screen="leaderboard">🏆 Рейтинг</button>
  </div>

  <!-- Экран кликера -->
  <div class="screen active" id="screen-clicker">
    <div class="container">
      <div class="counter" id="counter">0</div>
      <button class="btn" id="tapBtn">Нажми</button>
    </div>
  </div>

  <!-- Экран магазина -->
  <div class="screen" id="screen-shop">
    <div class="shop-subtabs">
      <button class="shop-subtab active" data-subtab="themes">🎨 Темы</button>
      <button class="shop-subtab" data-subtab="bonuses">🎁 Бонусы</button>
    </div>

    <div class="shop-content" id="shopThemes">
      <div class="shop-list" id="shopList">
        <div class="loading">Загрузка...</div>
      </div>
    </div>

        <div class="shop-content" id="shopBonuses" style="display: none;">
      <div class="shop-list" id="bonusesList">
        <div class="loading">Загрузка...</div>
      </div>
    </div>

  <!-- Экран лидерборда -->
  <div class="screen" id="screen-leaderboard">
    <div class="leaderboard-title">🏆 Топ-10 игроков</div>
    <div class="leaderboard-list" id="leaderboardList">
      <div class="loading">Загрузка...</div>
    </div>
  </div>

  <!-- Нижняя панель -->
  <div class="bottom-nav">
        <button class="nav-btn" id="donateBtn">
      <span class="icon">💝</span>
      <span>Поддержать</span>
    </button>
    <button class="nav-btn" id="channelBtn">
      <span class="icon">📢</span>
      <span>Канал</span>
    </button>
    <button class="nav-btn" id="infoBtn">
      <span class="icon">ℹ️</span>
      <span>О боте</span>
    </button>
  </div>

  <!-- ============================================================
       СКРИПТ
       ============================================================ -->
  <script>
    // ============================================================
    // 1. ИНИЦИАЛИЗАЦИЯ
    // ============================================================

    const tg = window.Telegram && window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    // ⚠️ ЗАМЕНИ на URL своего воркера (без слэша в конце!)
    const API_URL = 'https://basicclickbot.g3316464.workers.dev';

    // ⚠️ ЗАМЕНИ на свои ссылки
    const DONATE_URL = 'https://t.me/tribute';
    const CHANNEL_URL = 'https://t.me/твой_канал';

    // ---------- DOM-элементы ----------
    const counterEl = document.getElementById('counter');
    const btn = document.getElementById('tapBtn');
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    const leaderboardList = document.getElementById('leaderboardList');
    const shopList = document.getElementById('shopList');

        // ---------- Состояние ----------
    let count = 0;
    let particles = [];
    let saveTimer = null;
    let currentMultiplier = 1;
    let multiplierTimer = null;

    // ============================================================
    // 2. CANVAS (частицы)
    // ============================================================

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // ============================================================
    // 3. ТЕМЫ — применение, hex-хелперы
    // ============================================================

    function applyTheme(theme) {
      if (!theme) return;

      const root = document.documentElement;
      const body = document.body;

      // Фон
      body.style.background = theme.bg;
      body.style.backgroundAttachment = 'fixed';

      if (theme.animated) {
        body.style.backgroundSize = '400% 400%';
        body.style.animation = 'gradientShift 15s ease infinite';
      } else {
        body.style.backgroundSize = '';
        body.style.animation = '';
      }

      // Акцент
      root.style.setProperty('--accent-color', theme.accent);

      // Производные цвета
      const rgb = hexToRgb(theme.accent);
      if (rgb) {
        root.style.setProperty('--accent-color-soft', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.3)');
        root.style.setProperty('--accent-color-border', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.3)');
        root.style.setProperty('--accent-color-glow', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.6)');
        root.style.setProperty('--accent-color-bg', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.15)');
        root.style.setProperty('--panel-bg', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.15)');
        root.style.setProperty('--panel-border', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.3)');
      }

      // Градиент и тень кнопки
      root.style.setProperty('--btn-gradient', theme.btn);
      if (theme.shadow) {
        root.style.setProperty('--btn-shadow', theme.shadow);
      }

      // Кнопка «Нажми»
      const tapBtnEl = document.getElementById('tapBtn');
      if (tapBtnEl) {
        tapBtnEl.style.background = theme.btn;
        tapBtnEl.style.boxShadow = '0 10px 40px ' + theme.shadow;
      }
    }

    function hexToRgb(hex) {
      if (!hex || hex.charAt(0) !== '#') return null;
      const h = hex.slice(1);
      if (h.length !== 6) return null;
      return {
        r: parseInt(h.slice(0, 2), 16),
        g: parseInt(h.slice(2, 4), 16),
        b: parseInt(h.slice(4, 6), 16),
      };
    }

    // ============================================================
    // 4. ЗАГРУЗКА СЧЁТА И ТЕМЫ ПРИ СТАРТЕ
    // ============================================================

    async function loadCount() {
      try {
        const res = await fetch(API_URL + '/api/me', {
          headers: { 'X-Init-Data': tg ? tg.initData : '' }
        });
        const data = await res.json();
        count = data.count || 0;
        counterEl.textContent = count;

        // Применяем сохранённую тему
        if (data.theme) {
          const themeRes = await fetch(API_URL + '/api/themes', {
            headers: { 'X-Init-Data': tg ? tg.initData : '' }
          });
          const themeData = await themeRes.json();
          const activeTheme = themeData.themes.find(t => t.id === data.theme);
          if (activeTheme) {
            applyTheme(activeTheme);
          }
        }
                // Загружаем множитель
        const bonusRes = await fetch(API_URL + '/api/bonuses', {
          headers: { 'X-Init-Data': tg ? tg.initData : '' }
        });
        const bonusData = await bonusRes.json();
        currentMultiplier = bonusData.multiplier || 1;
        if (bonusData.activeUntil && bonusData.activeUntil > Date.now()) {
          startMultiplierTimer(bonusData.activeUntil);
        }
        updateMultiplierBadge();
        
      } catch (e) {
        console.error('Load error:', e);
      }
    }

    // ============================================================
    // 5. СОХРАНЕНИЕ СЧЁТА (с дебаунсом)
    // ============================================================

    function saveCount() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.setItem('tap_count', String(count));
        }
        try {
          await fetch(API_URL + '/api/count', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Init-Data': tg ? tg.initData : ''
            },
            body: JSON.stringify({ count: count })
          });
        } catch (e) {
          console.error('Save failed:', e);
        }
      }, 200);
    }

    // ============================================================
    // 6. ЧАСТИЦЫ
    // ============================================================

    function spawnParticles(x, y) {
      const colors = ['#a855f7', '#6366f1', '#c084fc', '#818cf8', '#e0aaff'];
      for (let i = 0; i < 0; i++) {
        const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.5;
        const speed = 3 + Math.random() * 4;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 3 + Math.random() * 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1,
          decay: 0.02 + Math.random() * 0.02
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.vx *= 0.98;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }
    animate();

    // ============================================================
    // 7. КЛИК ПО КНОПКЕ
    // ============================================================

    btn.addEventListener('click', () => {
      count++;
      counterEl.textContent = count;

      counterEl.classList.add('bump');
      setTimeout(() => counterEl.classList.remove('bump'), 150);

      const rect = btn.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      saveCount();
    });

    // ============================================================
    // 8. ВЕРХНИЕ ВКЛАДКИ
    // ============================================================

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const screenName = tab.dataset.screen;

        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + screenName).classList.add('active');

        if (screenName === 'leaderboard') loadLeaderboard();
        if (screenName === 'shop') loadThemes();

        if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      });
    });

    // ============================================================
    // 9. ПОД-ВКЛАДКИ МАГАЗИНА
    // ============================================================

    document.querySelectorAll('.shop-subtab').forEach(tab => {
      tab.addEventListener('click', () => {
        const subtab = tab.dataset.subtab;

        document.querySelectorAll('.shop-subtab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        document.getElementById('shopThemes').style.display = 'none';
        document.getElementById('shopBonuses').style.display = 'none';

                if (subtab === 'themes') {
          document.getElementById('shopThemes').style.display = 'block';
        } else if (subtab === 'bonuses') {
          document.getElementById('shopBonuses').style.display = 'block';
          loadBonuses();
        }

        if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      });
    });

    // ============================================================
    // 10. ЛИДЕРБОРД
    // ============================================================

    async function loadLeaderboard() {
      leaderboardList.innerHTML = '<div class="loading">Загрузка...</div>';

      try {
        const res = await fetch(API_URL + '/api/top', {
          headers: { 'X-Init-Data': tg ? tg.initData : '' }
        });
        const data = await res.json();

        if (!data.players || data.players.length === 0) {
          leaderboardList.innerHTML = '<div class="empty">Пока никого нет 😢</div>';
          return;
        }

        const myId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user
          ? tg.initDataUnsafe.user.id
          : null;
        const medals = ['🥇', '🥈', '🥉'];

        let html = '';
        data.players.forEach((p, i) => {
          let rankClass = '';
          if (i === 0) rankClass = 'gold';
          else if (i === 1) rankClass = 'silver';
          else if (i === 2) rankClass = 'bronze';

          const isMe = p.user_id === myId ? 'me' : '';
          const rankDisplay = i < 3 ? medals[i] : String(i + 1);

          const rawName = p.display_name || 'Игрок';
          const name = escapeHtml(rawName.charAt(0) === '@' ? rawName : '@' + rawName);

          html += '<div class="leaderboard-item ' + isMe + '">';
          html += '<div class="rank ' + rankClass + '">' + rankDisplay + '</div>';
          html += '<div class="player-name">' + name + '</div>';
          html += '<div class="player-score">' + p.count + '</div>';
          html += '</div>';
        });

        leaderboardList.innerHTML = html;
      } catch (e) {
        leaderboardList.innerHTML = '<div class="empty">Ошибка загрузки 😢</div>';
        console.error(e);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ============================================================
    // 11.1. МАГАЗИН — БОНУСЫ
    // ============================================================

    async function loadBonuses() {
      const bonusesList = document.getElementById('bonusesList');
      bonusesList.innerHTML = '<div class="loading">Загрузка...</div>';

      try {
        const res = await fetch(API_URL + '/api/bonuses', {
          headers: { 'X-Init-Data': tg ? tg.initData : '' }
        });
        const data = await res.json();

        if (!data.bonuses || data.bonuses.length === 0) {
          bonusesList.innerHTML = '<div class="empty">Бонусов пока нет 😢</div>';
          return;
        }

        let html = '';
        data.bonuses.forEach(b => {
          const isActive = b.active ? 'shop-item-active' : '';
          let btnText, btnDisabled;

          if (b.active) {
            btnText = '✅ Активен';
            btnDisabled = true;
          } else {
            btnText = 'Купить';
            btnDisabled = false;
          }

          html += '<div class="shop-item ' + isActive + '">';
          html += '<div class="shop-item-icon">' + b.icon + '</div>';
          html += '<div class="shop-item-info">';
          html += '<div class="shop-item-name">' + escapeHtml(b.name) + '</div>';
          html += '<div class="shop-item-desc">' + escapeHtml(b.desc) + '</div>';
          html += '</div>';
          html += '<div class="shop-item-price">' + b.price + ' 🪙</div>';
          html += '<button class="shop-buy-btn" data-bonus="' + b.id + '"' + (btnDisabled ? ' disabled' : '') + '>' + btnText + '</button>';
          html += '</div>';
        });

        bonusesList.innerHTML = html;

        currentMultiplier = data.multiplier || 1;
        updateMultiplierBadge();

        document.querySelectorAll('[data-bonus]').forEach(btn => {
          btn.addEventListener('click', () => {
            buyBonus(btn.dataset.bonus);
          });
        });
      } catch (e) {
        bonusesList.innerHTML = '<div class="empty">Ошибка загрузки 😢</div>';
        console.error(e);
      }
    }

    async function buyBonus(bonusId) {
      try {
        const res = await fetch(API_URL + '/api/bonuses/buy', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Init-Data': tg ? tg.initData : ''
          },
          body: JSON.stringify({ bonusId: bonusId })
        });
        const data = await res.json();

        if (data.error === 'not_enough') {
          if (tg && tg.showPopup) {
            tg.showPopup({
              title: 'Недостаточно кликов',
              message: 'Нужно: ' + data.need + '\nУ тебя: ' + data.have,
              buttons: [{ type: 'close' }]
            });
          }
          return;
        }

        if (data.error === 'already_active') {
          if (tg && tg.showPopup) {
            tg.showPopup({
              title: 'Уже активно',
              message: 'Этот бонус уже действует',
              buttons: [{ type: 'close' }]
            });
          }
          return;
        }

        if (data.ok) {
          count = data.newCount;
          counterEl.textContent = count;
          currentMultiplier = data.bonus.multiplier || 1;

          if (tg && tg.showPopup) {
            tg.showPopup({
              title: '✅ Активировано!',
              message: data.bonus.name + ' — действует 1 минуту',
              buttons: [{ type: 'close' }]
            });
          }
          if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
          }

          startMultiplierTimer(data.expiresAt);
          loadBonuses();
        }
      } catch (e) {
        console.error('Buy bonus error:', e);
      }
    }

    function startMultiplierTimer(expiresAt) {
      if (multiplierTimer) clearInterval(multiplierTimer);

      const update = () => {
        const remaining = expiresAt - Date.now();
        if (remaining <= 0) {
          currentMultiplier = 1;
          updateMultiplierBadge();
          clearInterval(multiplierTimer);
          multiplierTimer = null;
          return;
        }
        updateMultiplierBadge(remaining);
      };

      update();
      multiplierTimer = setInterval(update, 1000);
    }

    function updateMultiplierBadge(remaining) {
      let badge = document.getElementById('multiplierBadge');

      if (currentMultiplier <= 1) {
        if (badge) badge.remove();
        return;
      }

      if (!badge) {
        badge = document.createElement('div');
        badge.id = 'multiplierBadge';
        badge.className = 'multiplier-badge';
        const container = document.querySelector('#screen-clicker .container');
        container.insertBefore(badge, counterEl);
      }

      let text = '⚡ x' + currentMultiplier;
      if (remaining && remaining > 0) {
        const sec = Math.ceil(remaining / 1000);
        text += ' · ' + sec + 'с';
      }
      badge.textContent = text;
    }
    
    // ============================================================
    // 11.2. МАГАЗИН — ЗАГРУЗКА ТЕМ
    // ============================================================

    async function loadThemes() {
      shopList.innerHTML = '<div class="loading">Загрузка...</div>';

      try {
        const res = await fetch(API_URL + '/api/themes', {
          headers: { 'X-Init-Data': tg ? tg.initData : '' }
        });
        const data = await res.json();

        if (!data.themes || data.themes.length === 0) {
          shopList.innerHTML = '<div class="empty">Магазин пуст 😢</div>';
          return;
        }

        let html = '';
        data.themes.forEach(t => {
          const isActive = t.active ? 'shop-item-active' : '';
          let btnText, btnDisabled;

          if (t.active) {
            btnText = '✅ Активна';
            btnDisabled = true;
          } else if (t.owned) {
            btnText = 'Применить';
            btnDisabled = false;
          } else {
            btnText = 'Купить';
            btnDisabled = false;
          }

          html += '<div class="shop-item ' + isActive + '">';
          html += '<div class="shop-item-icon">' + t.icon + '</div>';
          html += '<div class="shop-item-info">';
          html += '<div class="shop-item-name">' + escapeHtml(t.name) + '</div>';
          html += '<div class="shop-item-desc">' + escapeHtml(t.desc) + '</div>';
          html += '</div>';
          if (!t.owned) {
            html += '<div class="shop-item-price">' + t.price + ' 🪙</div>';
          }
          html += '<button class="shop-buy-btn" data-theme="' + t.id + '" data-owned="' + t.owned + '"' + (btnDisabled ? ' disabled' : '') + '>' + btnText + '</button>';
          html += '</div>';
        });

        shopList.innerHTML = html;

        document.querySelectorAll('.shop-buy-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const themeId = btn.dataset.theme;
            const owned = btn.dataset.owned === 'true';
            if (owned) {
              activateTheme(themeId);
            } else {
              buyTheme(themeId);
            }
          });
        });
      } catch (e) {
        shopList.innerHTML = '<div class="empty">Ошибка загрузки 😢</div>';
        console.error(e);
      }
    }

    // ============================================================
    // 12. МАГАЗИН — ПОКУПКА И АКТИВАЦИЯ
    // ============================================================

    async function buyTheme(themeId) {
      try {
        const res = await fetch(API_URL + '/api/themes/buy', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Init-Data': tg ? tg.initData : ''
          },
          body: JSON.stringify({ themeId: themeId })
        });
        const data = await res.json();

        if (data.error === 'not_enough') {
          if (tg && tg.showPopup) {
            tg.showPopup({
              title: 'Недостаточно кликов',
              message: 'Нужно: ' + data.need + '\nУ тебя: ' + data.have,
              buttons: [{ type: 'close' }]
            });
          }
          return;
        }

        if (data.ok) {
          count = data.newCount !== undefined ? data.newCount : count;
          counterEl.textContent = count;
          applyTheme(data.theme);

          if (tg && tg.showPopup) {
            tg.showPopup({
              title: '✅ Куплено!',
              message: data.theme.name + ' активирована',
              buttons: [{ type: 'close' }]
            });
          }
          if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
          }

          loadThemes();
        }
      } catch (e) {
        console.error('Buy theme error:', e);
      }
    }

    async function activateTheme(themeId) {
      try {
        const res = await fetch(API_URL + '/api/themes/activate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Init-Data': tg ? tg.initData : ''
          },
          body: JSON.stringify({ themeId: themeId })
        });
        const data = await res.json();

        if (data.ok) {
          applyTheme(data.theme);
          if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
          }
          loadThemes();
        }
      } catch (e) {
        console.error('Activate theme error:', e);
      }
    }

    // ============================================================
    // 13. НИЖНЯЯ НАВИГАЦИЯ
    // ============================================================

    document.getElementById('donateBtn').addEventListener('click', () => {
      if (tg && tg.openLink) {
        tg.openLink(DONATE_URL);
      } else {
        window.open(DONATE_URL, '_blank');
      }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    document.getElementById('channelBtn').addEventListener('click', () => {
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(CHANNEL_URL);
      } else {
        window.open(CHANNEL_URL, '_blank');
      }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    document.getElementById('infoBtn').addEventListener('click', () => {
      if (tg && tg.showPopup) {
        tg.showPopup({
          title: 'О боте',
          message: 'BasicClickBot — простой кликер с лидербордом.\n\n' +
                   '🎯 Жми кнопку, чтобы увеличить счёт\n' +
                   '🛒 Покупай темы за клики\n' +
                   '🏆 Соревнуйся с другими игроками\n' +
                   '💝 Поддержи проект донатом\n\n' +
                   'Версия 1.0',
          buttons: [{ type: 'close' }]
        });
      } else {
        alert('BasicClickBot — кликер с лидербордом. Версия 1.0');
      }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    // ============================================================
    // 14. СТАРТ
    // ============================================================

    loadCount();
  </script>
