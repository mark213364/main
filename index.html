<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Счётчик</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #0a0e27 0%, #1a1a4e 50%, #4a1a6b 100%);
  color: #ffffff;
  user-select: none;
}
    }
    .container {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh; gap: 40px; padding: 20px;
    }
    .counter {
      font-size: 96px; font-weight: 700; line-height: 1;
      transition: transform 0.15s ease;
    }
    .counter.bump { transform: scale(1.15); }
    .btn {
      width: 200px; height: 200px; border-radius: 50%; border: none;
      background: var(--tg-theme-button-color, #2ea6ff);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 22px; font-weight: 600; cursor: pointer;
      box-shadow: 0 10px 30px rgba(46, 166, 255, 0.4);
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.94); }
  </style>
</head>
<body>
  <div class="container">
    <div class="counter" id="counter">0</div>
    <button class="btn" id="tapBtn">Нажми</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const counterEl = document.getElementById('counter');
    const btn = document.getElementById('tapBtn');

    let count = 0;

    // 1. Загружаем счёт из CloudStorage при старте
    if (tg?.CloudStorage) {
      tg.CloudStorage.getItem('tap_count', (err, value) => {
        if (!err && value) {
          count = parseInt(value, 10) || 0;
          counterEl.textContent = count;
        }
      });
    }

    // 2. Обработка нажатия
    btn.addEventListener('click', () => {
      count++;
      counterEl.textContent = count;

      counterEl.classList.add('bump');
      setTimeout(() => counterEl.classList.remove('bump'), 150);

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      // 3. Сохраняем в CloudStorage
      if (tg?.CloudStorage) {
        tg.CloudStorage.setItem('tap_count', String(count));
      }
    });
  </script>
</body>
</html>
