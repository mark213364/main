<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Предложить идею</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html { height: 100%; }

    body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      overflow-x: hidden;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--tg-theme-text-color, #000000);
      margin-bottom: 8px;
    }

    .header-subtitle {
      font-size: 14px;
      color: var(--tg-theme-hint-color, #999999);
      line-height: 1.4;
    }

    .field {
      margin-bottom: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .field-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--tg-theme-text-color, #000000);
      margin-bottom: 8px;
    }

    .textarea {
      flex: 1;
      min-height: 180px;
      padding: 14px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      color: var(--tg-theme-text-color, #000000);
      border: 1px solid var(--tg-theme-hint-color, #e0e0e0);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.4;
      resize: none;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .textarea:focus {
      border-color: var(--tg-theme-button-color, #2ea6ff);
    }

    .textarea::placeholder {
      color: var(--tg-theme-hint-color, #999999);
    }

    .counter {
      text-align: right;
      font-size: 12px;
      color: var(--tg-theme-hint-color, #999999);
      margin-top: 6px;
    }

    .counter.over { color: #ef4444; }

    .btn {
      width: 100%;
      padding: 16px;
      background: var(--tg-theme-button-color, #2ea6ff);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
      margin-top: 8px;
    }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .btn.loading { pointer-events: none; }

    /* Экран успеха */
    .success {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      flex: 1;
    }

    .success.active { display: flex; }

    .success-icon {
      font-size: 80px;
      line-height: 1;
      margin-bottom: 20px;
      animation: pop 0.5s ease;
    }

    @keyframes pop {
      0%   { transform: scale(0); }
      60%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .success-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--tg-theme-text-color, #000000);
      margin-bottom: 12px;
    }

    .success-text {
      font-size: 15px;
      color: var(--tg-theme-hint-color, #999999);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .success-id {
      display: inline-block;
      padding: 6px 14px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--tg-theme-hint-color, #999999);
      margin-bottom: 24px;
    }

    .btn-secondary {
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      color: var(--tg-theme-text-color, #000000);
    }
  </style>
</head>
<body>
  <!-- ФОРМА -->
  <div class="container" id="formScreen">
    <div class="header">
      <div class="header-icon">💡</div>
      <div class="header-title">Предложить идею</div>
      <div class="header-subtitle">
        Расскажи, что добавить или изменить в игре.<br>
        Мы рассмотрим твоё предложение.
      </div>
    </div>

    <div class="field">
      <div class="field-label">Твоё предложение</div>
      <textarea
        id="textInput"
        class="textarea"
        placeholder="Например: добавьте ежедневный бонус за вход..."
        maxlength="1000"
      ></textarea>
      <div class="counter" id="counter">0 / 1000</div>
    </div>

    <button class="btn" id="sendBtn" disabled>Отправить</button>
  </div>

  <!-- ЭКРАН УСПЕХА -->
  <div class="success" id="successScreen">
    <div class="success-icon">✅</div>
    <div class="success-title">Отправлено!</div>
    <div class="success-text">
      Твоё предложение передано разработчику.<br>
      Ответ придёт в чат с ботом.
    </div>
    <div class="success-id" id="proposalId">#0</div>
    <button class="btn btn-secondary" id="sendMoreBtn">Отправить ещё</button>
  </div>

  <script>
    // ============================================================
    // 1. ИНИЦИАЛИЗАЦИЯ
    // ============================================================

    const tg = window.Telegram && window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    // ⚠️ ЗАМЕНИ на URL своего воркера chatpromo (БЕЗ слэша в конце!)
    const API_URL = 'https://chatpromo.g3316464.workers.dev';

    const textInput = document.getElementById('textInput');
    const counter = document.getElementById('counter');
    const sendBtn = document.getElementById('sendBtn');
    const formScreen = document.getElementById('formScreen');
    const successScreen = document.getElementById('successScreen');
    const proposalIdEl = document.getElementById('proposalId');
    const sendMoreBtn = document.getElementById('sendMoreBtn');

    const MAX_LENGTH = 1000;
    const MIN_LENGTH = 3;

    // ============================================================
    // 2. UI — счётчик и состояние кнопки
    // ============================================================

    function updateUI() {
      const len = textInput.value.length;
      counter.textContent = len + ' / ' + MAX_LENGTH;
      counter.classList.toggle('over', len > MAX_LENGTH);

      sendBtn.disabled = len < MIN_LENGTH || len > MAX_LENGTH;
    }

    textInput.addEventListener('input', updateUI);
    updateUI();

    // ============================================================
    // 3. ОТПРАВКА
    // ============================================================

    sendBtn.addEventListener('click', async () => {
      const text = textInput.value.trim();

      if (text.length < MIN_LENGTH) {
        if (tg && tg.showAlert) {
          tg.showAlert('Слишком короткое предложение');
        }
        return;
      }

      sendBtn.disabled = true;
      sendBtn.classList.add('loading');
      sendBtn.textContent = 'Отправка...';

      try {
        const res = await fetch(API_URL + '/api/send', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Init-Data': tg ? tg.initData : ''
          },
          body: JSON.stringify({ text: text })
        });

        const data = await res.json();

        if (data.ok) {
          proposalIdEl.textContent = '#' + data.proposalId;
          formScreen.style.display = 'none';
          successScreen.classList.add('active');

          if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
          }
        } else {
          if (tg && tg.showAlert) {
            tg.showAlert(data.message || 'Ошибка отправки');
          }
          sendBtn.disabled = false;
        }
      } catch (e) {
        console.error('Send error:', e);
        if (tg && tg.showAlert) {
          tg.showAlert('Ошибка сети. Попробуй позже.');
        }
        sendBtn.disabled = false;
      } finally {
        sendBtn.classList.remove('loading');
        sendBtn.textContent = 'Отправить';
      }
    });

    // ============================================================
    // 4. ОТПРАВИТЬ ЕЩЁ
    // ============================================================

    sendMoreBtn.addEventListener('click', () => {
      textInput.value = '';
      updateUI();
      successScreen.classList.remove('active');
      formScreen.style.display = 'flex';
      sendBtn.disabled = true;
    });
  </script>
</body>
</html>
