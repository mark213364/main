<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TapllyBot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a4e 50%, #4a1a6b 100%);
      background-attachment: fixed;
      overflow: hidden;
    }

    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .tabs {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      background: rgba(10, 14, 39, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(168, 85, 247, 0.3);
      z-index: 100;
    }

    .tab {
      flex: 1;
      padding: 16px 8px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s ease;
      position: relative;
      font-family: inherit;
    }

    .tab.active { color: #ffffff; }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 3px 3px 0 0;
    }

    .screen {
      display: none;
      position: absolute;
      top: 56px;
      left: 0;
      right: 0;
      bottom: 70px;
      z-index: 50;
    }

    .screen.active { display: block; }
    
    /* ---------- Экран магазина ---------- */
    #screen-shop {
      overflow-y: auto;
      padding: 16px;
    }

    .shop-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #c084fc;
    }

    .shop-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .shop-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(168, 85, 247, 0.2);
      border-radius: 14px;
      gap: 12px;
    }

    .shop-item-icon {
      font-size: 32px;
      line-height: 1;
      flex-shrink: 0;
    }

    .shop-item-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .shop-item-name {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }

    .shop-item-desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shop-item-price {
      font-size: 14px;
      font-weight: 700;
      color: #a855f7;
      flex-shrink: 0;
      text-align: right;
    }

    #screen-clicker .container {
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      height: 100%;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
      z-index: 60;
    }

    .counter {
      grid-row: 1;
      align-self: end;
      font-size: 96px;
      font-weight: 700;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
      transition: transform 0.15s ease;
      margin-bottom: 40px;
    }

    .counter.bump { transform: scale(1.15); }

    .btn {
      grid-row: 2;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 40px rgba(168, 85, 247, 0.5);
      transition: transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      position: relative;
      z-index: 60;
    }

    .btn:active { transform: scale(0.94); }

    #screen-leaderboard {
      overflow-y: auto;
      padding: 16px;
    }

    .leaderboard-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #c084fc;
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(168, 85, 247, 0.2);
      border-radius: 14px;
    }

    .leaderboard-item.me {
      background: rgba(168, 85, 247, 0.15);
      border-color: rgba(168, 85, 247, 0.5);
    }

    .rank {
      font-size: 20px;
      font-weight: 700;
      width: 40px;
      text-align: center;
      flex-shrink: 0;
    }

    .rank.gold   { color: #ffd700; }
    .rank.silver { color: #c0c0c0; }
    .rank.bronze { color: #cd7f32; }

    .player-name {
      flex: 1;
      margin-left: 12px;
      font-size: 15px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-score {
      font-size: 16px;
      font-weight: 700;
      color: #a855f7;
      flex-shrink: 0;
    }

    .loading, .empty {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 15px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(10, 14, 39, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(168, 85, 247, 0.3);
      padding: 10px 0;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 200;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 12px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .nav-btn:active {
      background: rgba(168, 85, 247, 0.15);
      color: #ffffff;
    }

    .nav-btn .icon {
      font-size: 22px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="tabs">
    <button class="tab" data-screen="shop">🛒 Магазин</button>
    <button class="tab active" data-screen="clicker">🎯 Кликер</button>
    <button class="tab" data-screen="leaderboard">🏆 Рейтинг</button>
  </div>

    <div class="screen" id="screen-shop">
    <div class="shop-title">🛒 Магазин</div>
    <div class="shop-list" id="shopList">
      <div class="empty">Скоро тут появятся товары 😊</div>
    </div>
  </div>
  
  <div class="screen active" id="screen-clicker">
    <div class="container">
      <div class="counter" id="counter">0</div>
      <button class="btn" id="tapBtn">Нажми</button>
    </div>
  </div>

  <div class="screen" id="screen-leaderboard">
    <div class="leaderboard-title">🏆 Топ-10 игроков</div>
    <div class="leaderboard-list" id="leaderboardList">
      <div class="loading">Загрузка...</div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" id="donateBtn">
      <span class="icon">💝</span>
      <span>Донат</span>
    </button>
    <button class="nav-btn" id="channelBtn">
      <span class="icon">📢</span>
      <span>Канал</span>
    </button>
    <button class="nav-btn" id="infoBtn">
      <span class="icon">ℹ️</span>
      <span>О боте</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    // ⚠️ ЗАМЕНИ на URL воркера (без слэша в конце!)
    const API_URL = 'https://basicclickbot.g3316464.workers.dev';

    // ⚠️ ЗАМЕНИ на свои ссылки
    const DONATE_URL = 'https://t.me/tribute';
    const CHANNEL_URL = 'https://t.me/твой_канал';

    const counterEl = document.getElementById('counter');
    const btn = document.getElementById('tapBtn');
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    const leaderboardList = document.getElementById('leaderboardList');

    let count = 0;
    let particles = [];
    let saveTimer = null;

    // ===== Canvas =====
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // ===== Загрузка счёта =====
    async function loadCount() {
      try {
        const res = await fetch(API_URL + '/api/me', {
          headers: { 'X-Init-Data': tg ? tg.initData : '' }
        });
        const data = await res.json();
        count = data.count || 0;
        counterEl.textContent = count;
      } catch (e) {
        console.error('Load error:', e);
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.getItem('tap_count', function(err, value) {
            if (!err && value) {
              count = parseInt(value, 10) || 0;
              counterEl.textContent = count;
            }
          });
        }
      }
    }

    // ===== Сохранение счёта =====
    function saveCount() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.setItem('tap_count', String(count));
        }
        try {
          await fetch(API_URL + '/api/count', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Init-Data': tg ? tg.initData : ''
            },
            body: JSON.stringify({ count: count })
          });
        } catch (e) {
          console.error('Save failed:', e);
        }
      }, 200);
    }

    // ===== Частицы =====
    function spawnParticles(x, y) {
      const colors = ['#a855f7', '#6366f1', '#c084fc', '#818cf8', '#e0aaff'];
      for (let i = 0; i < 18; i++) {
        const angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.5;
        const speed = 3 + Math.random() * 4;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 3 + Math.random() * 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1,
          decay: 0.02 + Math.random() * 0.02
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.vx *= 0.98;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }
    animate();

    // ===== Клик =====
    btn.addEventListener('click', () => {
      count++;
      counterEl.textContent = count;

      counterEl.classList.add('bump');
      setTimeout(() => counterEl.classList.remove('bump'), 150);

      const rect = btn.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      saveCount();
    });

    // ===== Вкладки =====
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const screenName = tab.dataset.screen;

        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + screenName).classList.add('active');

        if (screenName === 'leaderboard') {
          loadLeaderboard();
        }

        if (tg && tg.HapticFeedback) {
          tg.HapticFeedback.selectionChanged();
        }
      });
    });

    // ===== Лидерборд =====
    async function loadLeaderboard() {
      leaderboardList.innerHTML = '<div class="loading">Загрузка...</div>';

      try {
        const res = await fetch(API_URL + '/api/top', {
          headers: { 'X-Init-Data': tg ? tg.initData : '' }
        });
        const data = await res.json();

        if (!data.players || data.players.length === 0) {
          leaderboardList.innerHTML = '<div class="empty">Пока никого нет 😢</div>';
          return;
        }

        const myId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user
          ? tg.initDataUnsafe.user.id
          : null;
        const medals = ['🥇', '🥈', '🥉'];

        let html = '';
        data.players.forEach((p, i) => {
          let rankClass = '';
          if (i === 0) rankClass = 'gold';
          else if (i === 1) rankClass = 'silver';
          else if (i === 2) rankClass = 'bronze';

          const isMe = p.user_id === myId ? 'me' : '';
          const rankDisplay = i < 3 ? medals[i] : String(i + 1);

          const rawName = p.display_name || 'Игрок';
          const name = escapeHtml(rawName.charAt(0) === '@' ? rawName : '@' + rawName);

          html += '<div class="leaderboard-item ' + isMe + '">';
          html += '<div class="rank ' + rankClass + '">' + rankDisplay + '</div>';
          html += '<div class="player-name">' + name + '</div>';
          html += '<div class="player-score">' + p.count + '</div>';
          html += '</div>';
        });

        leaderboardList.innerHTML = html;
      } catch (e) {
        leaderboardList.innerHTML = '<div class="empty">Ошибка загрузки 😢</div>';
        console.error(e);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== Нижняя навигация =====
    document.getElementById('donateBtn').addEventListener('click', () => {
      if (tg && tg.openLink) {
        tg.openLink(DONATE_URL);
      } else {
        window.open(DONATE_URL, '_blank');
      }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    document.getElementById('channelBtn').addEventListener('click', () => {
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(CHANNEL_URL);
      } else {
        window.open(CHANNEL_URL, '_blank');
      }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    document.getElementById('infoBtn').addEventListener('click', () => {
      if (tg && tg.showPopup) {
        tg.showPopup({
          title: 'О боте',
          message: 'BasicClickBot — простой кликер с лидербордом.\n\n' +
                   '🎯 Жми кнопку, чтобы увеличить счёт\n' +
                   '🏆 Соревнуйся с другими игроками\n' +
                   '💝 Поддержи проект донатом\n\n' +
                   'Версия 1.0',
          buttons: [{ type: 'close' }]
        });
      } else {
        alert('BasicClickBot — кликер с лидербордом. Версия 1.0');
      }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    // ===== Старт =====
    loadCount();
  </script>
</body>
</html>
