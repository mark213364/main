<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BasicClickBot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --accent-color: var(--tg-theme-button-color, #2ea6ff);
      --accent-color-soft: rgba(46, 166, 255, 0.3);
      --accent-color-border: rgba(46, 166, 255, 0.3);
      --accent-color-glow: rgba(46, 166, 255, 0.6);
      --accent-color-bg: rgba(46, 166, 255, 0.15);
      --btn-gradient: var(--tg-theme-button-color, #2ea6ff);
      --btn-shadow: rgba(46, 166, 255, 0.3);
      --btn-text-color: var(--tg-theme-button-text-color, #ffffff);
      --panel-bg: var(--tg-theme-bg-color, #ffffff);
      --panel-border: var(--tg-theme-secondary-bg-color, #f0f0f0);
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--tg-theme-text-color, #000000);
      background: var(--tg-theme-bg-color, #ffffff);
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    #particles {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }

    .tabs {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      z-index: 100;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .tab {
      flex: 1; padding: 14px 4px;
      background: none; border: none;
      color: var(--tg-theme-hint-color, #999999);
      font-size: 12px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      gap: 3px; white-space: nowrap;
      transition: color 0.2s ease;
    }

    .tab.active { color: var(--tg-theme-text-color, #000000); }

    .tab.active::after {
      content: ''; position: absolute;
      bottom: 0; left: 20%; right: 20%;
      height: 3px;
      background: var(--btn-gradient);
      border-radius: 3px 3px 0 0;
    }

    .screen {
      display: none;
      position: absolute;
      top: 52px; left: 0; right: 0; bottom: 70px;
      z-index: 50;
      overflow-y: auto;
    }

    .screen.active { display: block; }

    #screen-clicker .container {
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      align-items: center; justify-items: center;
      height: 100%; width: 100%; padding: 20px;
      box-sizing: border-box;
      position: relative;
    }

    .counter {
      grid-row: 1; align-self: end;
      font-size: 72px; font-weight: 700; line-height: 1;
      color: var(--tg-theme-text-color, #000000);
      transition: transform 0.15s ease;
      margin-bottom: 40px;
    }

    .counter.bump { transform: scale(1.15); }

    .btn {
      grid-row: 2;
      width: 200px; height: 200px;
      border-radius: 50%; border: none;
      background: var(--btn-gradient);
      color: var(--btn-text-color);
      font-size: 22px; font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 40px var(--btn-shadow);
      transition: transform 0.1s ease;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit;
      position: relative;
    }

    .btn:active { transform: scale(0.94); }

    .btn .btn-skin-emoji {
      position: absolute;
      font-size: 90px;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .btn.has-skin .btn-label { display: none; }

    .multiplier-badge {
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      padding: 6px 16px;
      background: var(--btn-gradient);
      color: var(--btn-text-color);
      border-radius: 20px;
      font-size: 14px; font-weight: 700;
      box-shadow: 0 4px 15px var(--accent-color-soft);
      animation: pulseBadge 1.5s ease-in-out infinite;
      z-index: 100;
    }

    @keyframes pulseBadge {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50%      { transform: translateX(-50%) scale(1.05); }
    }

    #screen-leaderboard { padding: 16px; }

    .leaderboard-title {
      text-align: center; font-size: 20px; font-weight: 700;
      margin-bottom: 16px; color: var(--accent-color);
    }

    .leaderboard-list { display: flex; flex-direction: column; gap: 8px; }

    .leaderboard-item {
      display: flex; align-items: center;
      padding: 14px 16px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border: 1px solid var(--accent-color-border);
      border-radius: 14px;
    }

    .leaderboard-item.me {
      background: var(--accent-color-bg);
      border-color: var(--accent-color-glow);
    }

    .rank {
      font-size: 20px; font-weight: 700;
      width: 40px; text-align: center; flex-shrink: 0;
      color: var(--tg-theme-text-color, #000000);
    }

    .rank.gold   { color: #ffd700; }
    .rank.silver { color: #c0c0c0; }
    .rank.bronze { color: #cd7f32; }

    .player-name {
      flex: 1; margin-left: 12px;
      font-size: 15px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--tg-theme-text-color, #000000);
    }

    .player-score {
      font-size: 16px; font-weight: 700;
      color: var(--accent-color);
      flex-shrink: 0;
    }

    .loading, .empty {
      text-align: center; padding: 40px 20px;
      color: var(--tg-theme-hint-color, #999999);
      font-size: 15px;
    }

    #screen-shop { padding: 16px; }

    .shop-subtabs {
      display: flex; gap: 6px; margin-bottom: 16px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border-radius: 14px; padding: 4px;
    }

    .shop-subtab {
      flex: 1; padding: 10px 6px;
      background: none; border: none;
      color: var(--tg-theme-hint-color, #999999);
      font-size: 12px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      border-radius: 10px;
      transition: color 0.2s ease, background 0.2s ease;
      white-space: nowrap;
    }

    .shop-subtab.active {
      color: var(--btn-text-color);
      background: var(--btn-gradient);
    }

    .shop-section-title {
      font-size: 16px; font-weight: 700;
      margin: 16px 0 10px;
      color: var(--tg-theme-text-color, #000000);
    }

    .shop-section-title:first-child { margin-top: 0; }

    .shop-list {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }

    .shop-item {
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 12px 8px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border: 1px solid var(--accent-color-border);
      border-radius: 18px;
      aspect-ratio: 1 / 1;
      box-sizing: border-box;
      position: relative; overflow: hidden;
      text-align: center;
      transition: transform 0.15s ease;
      gap: 6px;
      min-width: 0;
    }

    .shop-item:active { transform: scale(0.97); }

    .shop-item-active {
      background: var(--accent-color-bg);
      border: 2px solid var(--accent-color-glow);
      box-shadow: 0 0 20px var(--accent-color-soft);
    }

    .shop-item-active::after {
      content: '✓';
      position: absolute;
      top: 8px; right: 8px;
      background: var(--accent-color);
      color: #ffffff;
      width: 22px; height: 22px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; line-height: 1;
    }

    .shop-item-icon {
      font-size: 40px; line-height: 1; margin-bottom: 4px;
      flex-shrink: 0;
    }

    .shop-item-info {
      display: flex; flex-direction: column; gap: 2px;
      flex: 1; justify-content: center;
      width: 100%; min-width: 0;
    }

    .shop-item-name {
      font-size: 13px; font-weight: 700;
      color: var(--tg-theme-text-color, #000000);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      width: 100%;
    }

    .shop-item-desc {
      font-size: 10px;
      color: var(--tg-theme-hint-color, #999999);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      width: 100%;
    }

    .shop-item-price {
      font-size: 12px; font-weight: 700;
      color: var(--accent-color);
      margin: 4px 0 2px;
    }

    .shop-buy-btn {
      background: var(--btn-gradient);
      color: var(--btn-text-color);
      border: none; border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      width: 100%; box-sizing: border-box;
      transition: transform 0.1s ease, opacity 0.2s ease;
      margin-top: auto;
    }

    .shop-buy-btn:active { transform: scale(0.95); }
    .shop-buy-btn:disabled {
      background: rgba(128, 128, 128, 0.3);
      color: rgba(255, 255, 255, 0.6);
      cursor: default; opacity: 0.7;
    }

    .shop-list > .shop-item:last-child:nth-child(odd) {
      grid-column: span 2;
      aspect-ratio: auto;
      min-height: 160px;
    }

    .promo-block {
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border: 1px solid var(--accent-color-border);
      border-radius: 16px;
      padding: 14px; margin-bottom: 16px;
      box-sizing: border-box; overflow: hidden;
    }

    .promo-title {
      font-size: 14px; font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 10px;
    }

    .promo-row {
      display: flex; gap: 8px;
      align-items: stretch;
      width: 100%; box-sizing: border-box;
    }

    .promo-input {
      flex: 1; min-width: 0;
      padding: 10px 12px;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      border: 1px solid var(--accent-color-border);
      border-radius: 10px;
      font-size: 13px; font-family: inherit;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      box-sizing: border-box;
    }

    .promo-input::placeholder {
      color: var(--tg-theme-hint-color, #999999);
      text-transform: none; letter-spacing: normal; font-weight: 400;
    }

    .promo-input:focus { border-color: var(--accent-color-glow); }

    .promo-btn {
      padding: 10px 14px;
      background: var(--btn-gradient);
      color: var(--btn-text-color);
      border: none; border-radius: 10px;
      font-size: 12px; font-weight: 700;
      font-family: inherit; cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0; box-sizing: border-box;
    }

    .promo-btn:active { transform: scale(0.96); }
    .promo-btn:disabled { opacity: 0.5; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: space-around; align-items: center;
      background: var(--panel-bg);
      border-top: 1px solid var(--panel-border);
      padding: 10px 0;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 200;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .nav-btn {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      background: none; border: none;
      color: var(--tg-theme-hint-color, #999999);
      font-family: inherit;
      font-size: 11px; font-weight: 500;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 12px;
      transition: color 0.2s ease;
    }

    .nav-btn:active { color: var(--accent-color); }
    .nav-btn .icon { font-size: 22px; line-height: 1; }

    .toast {
      position: fixed;
      bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: var(--btn-gradient);
      color: var(--btn-text-color);
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 30px var(--accent-color-soft);
      z-index: 9999;
      display: flex; align-items: center; gap: 8px;
      max-width: 90vw;
      box-sizing: border-box;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast .toast-icon { font-size: 20px; }
    .toast .toast-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

  <canvas id="particles"></canvas>

  <div class="tabs">
    <button class="tab" data-screen="shop">🛒 Магазин</button>
    <button class="tab active" data-screen="clicker">🎯 Кликер</button>
    <button class="tab" data-screen="leaderboard">🏆 Рейтинг</button>
  </div>

  <div class="screen active" id="screen-clicker">
    <div class="container">
      <div class="counter" id="counter">0</div>
      <button class="btn" id="tapBtn">
        <span class="btn-label">Нажми</span>
      </button>
    </div>
  </div>

  <div class="screen" id="screen-shop">
    <div class="shop-subtabs">
      <button class="shop-subtab active" data-subtab="custom">🎨 Кастомизация</button>
      <button class="shop-subtab" data-subtab="bonuses">🎁 Бонусы</button>
      <button class="shop-subtab" data-subtab="inventory">🎒 Инвентарь</button>
    </div>

    <div class="shop-content" id="shopCustom">
      <div class="shop-section-title">🎯 Скины кнопки</div>
      <div class="shop-list" id="skinsList"><div class="loading">Загрузка...</div></div>
      <div class="shop-section-title">🎨 Цвета</div>
      <div class="shop-list" id="colorsList"><div class="loading">Загрузка...</div></div>
    </div>

    <div class="shop-content" id="shopBonuses" style="display: none;">
      <div class="promo-block">
        <div class="promo-title">🎁 Промокод</div>
        <div class="promo-row">
          <input type="text" class="promo-input" id="promoInput" placeholder="Введи код" maxlength="30">
          <button class="promo-btn" id="promoBtn">Активировать</button>
        </div>
      </div>
      <div class="shop-list" id="bonusesList"><div class="loading">Загрузка...</div></div>
    </div>

    <div class="shop-content" id="shopInventory" style="display: none;">
      <div class="shop-list" id="inventoryList"><div class="loading">Загрузка...</div></div>
    </div>
  </div>

  <div class="screen" id="screen-leaderboard">
    <div class="leaderboard-title">🏆 Топ-10 игроков</div>
    <div class="leaderboard-list" id="leaderboardList"><div class="loading">Загрузка...</div></div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" id="donateBtn"><span class="icon">💝</span><span>Поддержать</span></button>
    <button class="nav-btn" id="channelBtn"><span class="icon">📢</span><span>Канал</span></button>
    <button class="nav-btn" id="infoBtn"><span class="icon">ℹ️</span><span>О боте</span></button>
  </div>

  <div class="toast" id="toast">
    <span class="toast-icon" id="toastIcon">🎉</span>
    <span class="toast-text" id="toastText"></span>
  </div>

  <script>
    // ⚙️ НАСТРОЙКИ
    const API_URL = 'https://broad-boat-0443.g3316464.workers.dev';
    const DONATE_URL = 'https://t.me/Kwbejdif';
    const CHANNEL_URL = 'https://t.me/твой_канал';
    const COIN = '🪙';
    const TOAST_DURATION = 2500;

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    const counterEl = document.getElementById('counter');
    const btn = document.getElementById('tapBtn');
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    const leaderboardList = document.getElementById('leaderboardList');
    const skinsList = document.getElementById('skinsList');
    const colorsList = document.getElementById('colorsList');
    const bonusesList = document.getElementById('bonusesList');
    const inventoryList = document.getElementById('inventoryList');

    let count = 0;
    let particles = [];
    let saveTimer = null;
    let currentMultiplier = 1;
    let multiplierTimer = null;
    let activeColor = 'default';
    let activeSkin = 'default';
    let toastTimer = null;

    function showToast(icon, text) {
      const toast = document.getElementById('toast');
      document.getElementById('toastIcon').textContent = icon;
      document.getElementById('toastText').textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), TOAST_DURATION);
    }

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function formatNumber(n) { return Number(n).toLocaleString('ru-RU'); }
    function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

    function formatTime(ms) {
      const sec = Math.ceil(ms / 1000);
      const min = Math.floor(sec / 60);
      const s = sec % 60;
      if (min > 0) return min + ':' + String(s).padStart(2, '0');
      return sec + 'с';
    }

    function hexToRgb(hex) {
      if (!hex || hex.charAt(0) !== '#') return null;
      const h = hex.slice(1);
      if (h.length !== 6) return null;
      return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
    }

    function applyColor(colorId) {
      activeColor = colorId || 'default';
      const root = document.documentElement;

      if (!colorId || colorId === 'default') {
        root.style.setProperty('--accent-color', 'var(--tg-theme-button-color, #2ea6ff)');
        root.style.setProperty('--accent-color-soft', 'rgba(46, 166, 255, 0.3)');
        root.style.setProperty('--accent-color-border', 'rgba(46, 166, 255, 0.3)');
        root.style.setProperty('--accent-color-glow', 'rgba(46, 166, 255, 0.6)');
        root.style.setProperty('--accent-color-bg', 'rgba(46, 166, 255, 0.15)');
        root.style.setProperty('--btn-gradient', 'var(--tg-theme-button-color, #2ea6ff)');
        root.style.setProperty('--btn-shadow', 'rgba(46, 166, 255, 0.3)');
        root.style.setProperty('--btn-text-color', 'var(--tg-theme-button-text-color, #ffffff)');
        root.style.setProperty('--panel-bg', 'var(--tg-theme-bg-color, #ffffff)');
        root.style.setProperty('--panel-border', 'var(--tg-theme-secondary-bg-color, #f0f0f0)');
        document.body.style.background = 'var(--tg-theme-bg-color, #ffffff)';
        btn.style.background = '';
        btn.style.boxShadow = '';
        return;
      }

      const colorData = window._colorsCache && window._colorsCache[colorId];
      if (!colorData) return;
      const hex = colorData.hex;
      const rgb = hexToRgb(hex);
      if (!rgb) return;

      root.style.setProperty('--accent-color', hex);
      root.style.setProperty('--accent-color-soft', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.3)');
      root.style.setProperty('--accent-color-border', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.3)');
      root.style.setProperty('--accent-color-glow', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.6)');
      root.style.setProperty('--accent-color-bg', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.15)');
      root.style.setProperty('--btn-gradient', hex);
      root.style.setProperty('--btn-shadow', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.5)');
      const isLight = (rgb.r * 0.299 + rgb.g * 0.587 + rgb.b * 0.114) > 180;
      root.style.setProperty('--btn-text-color', isLight ? '#000000' : '#ffffff');
      root.style.setProperty('--panel-bg', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.25)');
      root.style.setProperty('--panel-border', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.3)');
      document.body.style.background = 'linear-gradient(135deg, ' + hex + '33 0%, ' + hex + '11 100%)';
      btn.style.background = hex;
      btn.style.boxShadow = '0 10px 40px rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.5)';
    }

    function applySkin(skinId, skinIcon) {
      activeSkin = skinId || 'default';
      const oldSkin = btn.querySelector('.btn-skin-emoji');
      if (oldSkin) oldSkin.remove();
      const label = btn.querySelector('.btn-label');
      if (!skinId || skinId === 'default') {
        btn.classList.remove('has-skin');
        if (label) label.style.display = '';
        return;
      }
      btn.classList.add('has-skin');
      if (label) label.style.display = 'none';
      const emoji = document.createElement('span');
      emoji.className = 'btn-skin-emoji';
      emoji.textContent = skinIcon || '⭕';
      btn.appendChild(emoji);
    }

    async function loadCount() {
      try {
        const res = await fetch(API_URL + '/api/me', { headers: { 'X-Init-Data': tg ? tg.initData : '' } });
        const data = await res.json();
        count = data.count || 0;
        counterEl.textContent = formatNumber(count);
        await loadColorsSilent();
        await loadSkinsSilent();
        if (data.color) applyColor(data.color);
        if (data.skin) {
          const skins = window._skinsCache || {};
          const skinData = skins[data.skin];
          applySkin(data.skin, skinData ? skinData.icon : null);
        }
        currentMultiplier = data.multiplier || 1;
        updateMultiplierBadge();
      } catch (e) { console.error('Load error:', e); }
    }

    async function loadColorsSilent() {
      try {
        const res = await fetch(API_URL + '/api/colors', { headers: { 'X-Init-Data': tg ? tg.initData : '' } });
        const data = await res.json();
        window._colorsCache = {};
        (data.colors || []).forEach(c => { window._colorsCache[c.id] = c; });

    function spawnParticles(x, y) {
      const colors = ['#2ea6ff', '#4db8ff', '#6ab2f2', '#9ed4ff', '#c2e5ff'];
      for (let i = 0; i < 8; i++) {
        const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.5;
        const speed = 3 + Math.random() * 4;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size: 3 + Math.random() * 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1, decay: 0.02 + Math.random() * 0.02 });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.vx *= 0.98; p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }
    animate();

    function startMultiplierTimer(expiresAt) {
      if (multiplierTimer) clearInterval(multiplierTimer);
      const update = () => {
        const remaining = expiresAt - Date.now();
        if (remaining <= 0) { currentMultiplier = 1; updateMultiplierBadge(); clearInterval(multiplierTimer); multiplierTimer = null; return; }
        updateMultiplierBadge(remaining);
      };
      update();
      multiplierTimer = setInterval(update, 1000);
    }

    function updateMultiplierBadge(remaining) {
      let badge = document.getElementById('multiplierBadge');
      if (currentMultiplier <= 1) { if (badge) badge.remove(); return; }
      if (!badge) {
        badge = document.createElement('div');
        badge.id = 'multiplierBadge';
        badge.className = 'multiplier-badge';
        document.querySelector('#screen-clicker .container').appendChild(badge);
      }
      let text = '⚡ x' + currentMultiplier;
      if (remaining && remaining > 0) text += ' · ' + Math.ceil(remaining / 1000) + 'с';
      badge.textContent = text;
    }

    const promoInput = document.getElementById('promoInput');
    if (promoBtn) {
      promoBtn.addEventListener('click', activatePromo);
      promoInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') activatePromo(); });
    }

    async function activatePromo() {
      const code = (promoInput.value || '').trim().toUpperCase();
      if (!code) { showToast('❌', 'Введи промокод'); return; }
      promoBtn.disabled = true;
      promoBtn.textContent = '...';
      try {
        const res = await fetch(API_URL + '/api/promo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg ? tg.initData : '' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();
        if (data.ok) {
          count = data.newCount;
          counterEl.textContent = formatNumber(count);
          promoInput.value = '';
          showToast('🎁', '+' + formatNumber(data.reward) + ' ' + COIN);
          if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        } else showToast('❌', data.message || 'Ошибка');
      } catch (e) { showToast('❌', 'Ошибка сети'); }
      finally { promoBtn.disabled = false; promoBtn.textContent = 'Активировать'; }
    }

    document.getElementById('donateBtn').addEventListener('click', () => {
      if (tg && tg.openTelegramLink) tg.openTelegramLink(DONATE_URL);
      else if (tg && tg.openLink) tg.openLink(DONATE_URL);
      else window.open(DONATE_URL, '_blank');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });
    document.getElementById('channelBtn').addEventListener('click', () => {
      if (tg && tg.openTelegramLink) tg.openTelegramLink(CHANNEL_URL);
      else window.open(CHANNEL_URL, '_blank');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });
    document.getElementById('infoBtn').addEventListener('click', () => {
      showToast('ℹ️', 'BasicClickBot v2.0');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    loadCount();
  </script>
</body>
</html>
