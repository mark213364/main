<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BasicClickBot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --accent-color: var(--tg-theme-button-color, #2ea6ff);
      --accent-color-soft: rgba(46, 166, 255, 0.3);
      --accent-color-border: rgba(46, 166, 255, 0.3);
      --accent-color-glow: rgba(46, 166, 255, 0.6);
      --accent-color-bg: rgba(46, 166, 255, 0.15);
      --btn-gradient: var(--tg-theme-button-color, #2ea6ff);
      --btn-shadow: rgba(46, 166, 255, 0.3);
      --btn-text-color: var(--tg-theme-button-text-color, #ffffff);
      --panel-bg: var(--tg-theme-bg-color, #ffffff);
      --panel-border: var(--tg-theme-secondary-bg-color, #f0f0f0);
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--tg-theme-text-color, #000000);
      background: var(--tg-theme-bg-color, #ffffff);
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    #particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ===== ВЕРХНИЕ ВКЛАДКИ ===== */
    .tabs {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      z-index: 100;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .tab {
      flex: 1;
      padding: 14px 6px;
      background: none;
      border: none;
      color: var(--tg-theme-hint-color, #999999);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .tab.active { color: var(--tg-theme-text-color, #000000); }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 20%; right: 20%;
      height: 3px;
      background: var(--btn-gradient);
      border-radius: 3px 3px 0 0;
    }

    /* ===== ЭКРАНЫ ===== */
    .screen {
      display: none;
      position: absolute;
      top: 52px; left: 0; right: 0; bottom: 70px;
      z-index: 50;
      overflow-y: auto;
    }

    .screen.active { display: block; }

    /* ===== КЛИКЕР ===== */
    #screen-clicker .container {
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      height: 100%;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }

    .counter {
      grid-row: 1;
      align-self: end;
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      color: var(--tg-theme-text-color, #000000);
      transition: transform 0.15s ease;
      margin-bottom: 40px;
    }

    .counter.bump { transform: scale(1.15); }

    .btn {
      grid-row: 2;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      background: var(--btn-gradient);
      color: var(--btn-text-color);
      font-size: 22px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 40px var(--btn-shadow);
      transition: transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      position: relative;
    }

    .btn:active { transform: scale(0.94); }

    .multiplier-badge {
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      padding: 6px 16px;
      background: var(--btn-gradient);
      color: var(--btn-text-color);
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 15px var(--accent-color-soft);
      animation: pulseBadge 1.5s ease-in-out infinite;
      z-index: 100;
    }

    @keyframes pulseBadge {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50%      { transform: translateX(-50%) scale(1.05); }
    }

    /* ===== ЛИДЕРБОРД ===== */
    #screen-leaderboard { padding: 16px; }

    .leaderboard-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--accent-color);
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border: 1px solid var(--accent-color-border);
      border-radius: 14px;
    }

    .leaderboard-item.me {
      background: var(--accent-color-bg);
      border-color: var(--accent-color-glow);
    }

    .rank {
      font-size: 20px;
      font-weight: 700;
      width: 40px;
      text-align: center;
      flex-shrink: 0;
      color: var(--tg-theme-text-color, #000000);
    }

    .rank.gold   { color: #ffd700; }
    .rank.silver { color: #c0c0c0; }
    .rank.bronze { color: #cd7f32; }

    .player-name {
      flex: 1;
      margin-left: 12px;
      font-size: 15px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--tg-theme-text-color, #000000);
    }

    .player-score {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-color);
      flex-shrink: 0;
    }

    .loading, .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--tg-theme-hint-color, #999999);
      font-size: 15px;
    }

    /* ===== МАГАЗИН ===== */
    #screen-shop { padding: 16px; }

    .shop-subtabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border-radius: 14px;
      padding: 4px;
    }

    .shop-subtab {
      flex: 1;
      padding: 10px 12px;
      background: none;
      border: none;
      color: var(--tg-theme-hint-color, #999999);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border-radius: 10px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .shop-subtab.active {
      color: var(--btn-text-color);
      background: var(--btn-gradient);
    }

    .shop-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .shop-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 12px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border: 1px solid var(--accent-color-border);
      border-radius: 18px;
      aspect-ratio: 1 / 1;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      text-align: center;
      transition: transform 0.15s ease;
    }

    .shop-item:active { transform: scale(0.97); }

    .shop-item-active {
      background: var(--accent-color-bg);
      border: 2px solid var(--accent-color-glow);
      box-shadow: 0 0 20px var(--accent-color-soft);
    }

    .shop-item-active::after {
      content: '✓';
      position: absolute;
      top: 8px; right: 8px;
      background: var(--accent-color);
      color: #ffffff;
      width: 22px; height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .shop-item-icon {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .shop-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      justify-content: center;
      width: 100%;
      min-width: 0;
    }

    .shop-item-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--tg-theme-text-color, #000000);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shop-item-desc {
      font-size: 11px;
      color: var(--tg-theme-hint-color, #999999);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shop-item-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-color);
      margin: 6px 0 4px;
    }

    .shop-buy-btn {
      background: var(--btn-gradient);
      color: var(--btn-text-color);
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    .shop-buy-btn:active { transform: scale(0.95); }
    .shop-buy-btn:disabled {
      background: rgba(128, 128, 128, 0.3);
      color: rgba(255, 255, 255, 0.6);
      cursor: default;
      opacity: 0.7;
    }

    .shop-list > .shop-item:last-child:nth-child(odd) {
      grid-column: span 2;
      aspect-ratio: auto;
      min-height: 160px;
    }

    /* ===== ПРОМОКОД ===== */
    .promo-block {
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border: 1px solid var(--accent-color-border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .promo-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 10px;
    }

    .promo-row { display: flex; gap: 8px; }

    .promo-input {
      flex: 1;
      padding: 10px 14px;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      border: 1px solid var(--accent-color-border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .promo-input::placeholder {
      color: var(--tg-theme-hint-color, #999999);
      text-transform: none;
      letter-spacing: normal;
      font-weight: 400;
    }

    .promo-input:focus { border-color: var(--accent-color-glow); }

    .promo-btn {
      padding: 10px 16px;
      background: var(--btn-gradient);
      color: var(--btn-text-color);
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    .promo-btn:active { transform: scale(0.96); }
    .promo-btn:disabled { opacity: 0.5; }

    /* ===== НИЖНЯЯ ПАНЕЛЬ ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--panel-bg);
      border-top: 1px solid var(--panel-border);
      padding: 10px 0;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 200;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--tg-theme-hint-color, #999999);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 12px;
      transition: color 0.2s ease;
    }

    .nav-btn:active { color: var(--accent-color); }
    .nav-btn .icon { font-size: 22px; line-height: 1; }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <canvas id="particles"></canvas>

  <div class="tabs">
    <button class="tab" data-screen="shop">🛒 Магазин</button>
    <button class="tab active" data-screen="clicker">🎯 Кликер</button>
    <button class="tab" data-screen="leaderboard">🏆 Рейтинг</button>
  </div>

  <div class="screen active" id="screen-clicker">
    <div class="container">
      <div class="counter" id="counter">0</div>
      <button class="btn" id="tapBtn">Нажми</button>
    </div>
  </div>

  <div class="screen" id="screen-shop">
    <div class="shop-subtabs">
      <button class="shop-subtab active" data-subtab="themes">🎨 Темы</button>
      <button class="shop-subtab" data-subtab="bonuses">🎁 Бонусы</button>
    </div>

    <div class="shop-content" id="shopThemes">
      <div class="shop-list" id="shopList">
        <div class="loading">Загрузка...</div>
      </div>
    </div>

    <div class="shop-content" id="shopBonuses" style="display: none;">
      <div class="promo-block">
        <div class="promo-title">🎁 Промокод</div>
        <div class="promo-row">
          <input type="text" class="promo-input" id="promoInput" placeholder="Введи код" maxlength="30">
          <button class="promo-btn" id="promoBtn">Активировать</button>
        </div>
      </div>

      <div class="shop-list" id="bonusesList">
        <div class="loading">Загрузка...</div>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-leaderboard">
    <div class="leaderboard-title">🏆 Топ-10 игроков</div>
    <div class="leaderboard-list" id="leaderboardList">
      <div class="loading">Загрузка...</div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" id="donateBtn">
      <span class="icon">💝</span>
      <span>Поддержать</span>
    </button>
    <button class="nav-btn" id="channelBtn">
      <span class="icon">📢</span>
      <span>Канал</span>
    </button>
    <button class="nav-btn" id="infoBtn">
      <span class="icon">ℹ️</span>
      <span>О боте</span>
    </button>
  </div>

  <script>
    // ============================================================
    // 1. ИНИЦИАЛИЗАЦИЯ
    // ============================================================

    const tg = window.Telegram && window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    // ⚠️ ЗАМЕНИ на URL воркера (БЕЗ слэша в конце!)
    const API_URL = 'https://broad-boat-0443.g3316464.workers.dev/api/me';

    // ⚠️ ЗАМЕНИ на свои ссылки
    const DONATE_URL = 'https://t.me/Kwbejdif';
    const CHANNEL_URL = 'https://t.me/твой_канал';

    const COIN = '🪙';

    const counterEl = document.getElementById('counter');
    const btn = document.getElementById('tapBtn');
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    const leaderboardList = document.getElementById('leaderboardList');
    const shopList = document.getElementById('shopList');

    let count = 0;
    let particles = [];
    let saveTimer = null;
    let currentMultiplier = 1;
    let multiplierTimer = null;

    // ============================================================
    // 2. CANVAS
    // ============================================================

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function formatNumber(n) {
      return Number(n).toLocaleString('ru-RU');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function hexToRgb(hex) {
      if (!hex || hex.charAt(0) !== '#') return null;
      const h = hex.slice(1);
      if (h.length !== 6) return null;
      return {
        r: parseInt(h.slice(0, 2), 16),
        g: parseInt(h.slice(2, 4), 16),
        b: parseInt(h.slice(4, 6), 16),
      };
    }

    // ============================================================
    // 3. ТЕМЫ
    // ============================================================

    function applyTheme(theme) {
      if (!theme) return;

      const root = document.documentElement;
      const body = document.body;

      // ===== СИСТЕМНАЯ ТЕМА (Классика) =====
      if (theme.isSystem) {
        body.style.background = 'var(--tg-theme-bg-color, #ffffff)';
        body.style.backgroundAttachment = '';
        body.style.backgroundSize = '';
        body.style.animation = '';

        root.style.setProperty('--accent-color', 'var(--tg-theme-button-color, #2ea6ff)');
        root.style.setProperty('--accent-color-soft', 'rgba(46, 166, 255, 0.3)');
        root.style.setProperty('--accent-color-border', 'rgba(46, 166, 255, 0.3)');
        root.style.setProperty('--accent-color-glow', 'rgba(46, 166, 255, 0.6)');
        root.style.setProperty('--accent-color-bg', 'rgba(46, 166, 255, 0.15)');
        root.style.setProperty('--btn-gradient', 'var(--tg-theme-button-color, #2ea6ff)');
        root.style.setProperty('--btn-shadow', 'rgba(46, 166, 255, 0.3)');
        root.style.setProperty('--btn-text-color', 'var(--tg-theme-button-text-color, #ffffff)');
        root.style.setProperty('--panel-bg', 'var(--tg-theme-bg-color, #ffffff)');
        root.style.setProperty('--panel-border', 'var(--tg-theme-secondary-bg-color, #f0f0f0)');

        const tapBtnEl = document.getElementById('tapBtn');
        if (tapBtnEl) {
          tapBtnEl.style.background = '';
          tapBtnEl.style.boxShadow = '';
        }
        return;
      }

      // ===== КАСТОМНАЯ ТЕМА =====
      const rgb = hexToRgb(theme.accent);
      if (rgb) {
        root.style.setProperty('--accent-color', theme.accent);
        root.style.setProperty('--accent-color-soft', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.3)');
        root.style.setProperty('--accent-color-border', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.3)');
        root.style.setProperty('--accent-color-glow', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.6)');
        root.style.setProperty('--accent-color-bg', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.15)');
        root.style.setProperty('--panel-bg', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.35)');
        root.style.setProperty('--panel-border', 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.3)');
      }

      body.style.background = theme.bg;
      body.style.backgroundAttachment = 'fixed';

      if (theme.animated) {
        body.style.backgroundSize = '400% 400%';
        body.style.animation = 'gradientShift 15s ease infinite';
      } else {
        body.style.backgroundSize = '';
        body.style.animation = '';
      }

      root.style.setProperty('--btn-gradient', theme.btn);
      if (theme.shadow) root.style.setProperty('--btn-shadow', theme.shadow);
      root.style.setProperty('--btn-text-color', '#ffffff');

      const tapBtnEl = document.getElementById('tapBtn');
      if (tapBtnEl) {
        tapBtnEl.style.background = theme.btn;
        tapBtnEl.style.boxShadow = '0 10px 40px ' + theme.shadow;
      }
    }

    // ============================================================
    // 4. ЗАГРУЗКА
    // ============================================================

    async function loadCount() {
      try {
        const res = await fetch(API_URL + '/api/me', {
          headers: { 'X-Init-Data': tg ? tg.initData : '' }
        });
        const data = await res.json();
        count = data.count || 0;
        counterEl.textContent = formatNumber(count);

        if (data.theme) {
          const themeRes = await fetch(API_URL + '/api/themes', {
            headers: { 'X-Init-Data': tg ? tg.initData : '' }
          });
          const themeData = await themeRes.json();
          const activeTheme = themeData.themes.find(t => t.id === data.theme);
          if (activeTheme) applyTheme(activeTheme);
        }

        const bonusRes = await fetch(API_URL + '/api/bonuses', {
          headers: { 'X-Init-Data': tg ? tg.initData : '' }
        });
        const bonusData = await bonusRes.json();
        currentMultiplier = bonusData.multiplier || 1;
        if (bonusData.activeUntil && bonusData.activeUntil > Date.now()) {
          startMultiplierTimer(bonusData.activeUntil);
        }
        updateMultiplierBadge();
      } catch (e) {
        console.error('Load error:', e);
      }
    }

    // ============================================================
    // 5. СОХРАНЕНИЕ
    // ============================================================

    function saveCount() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          await fetch(API_URL + '/api/count', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Init-Data': tg ? tg.initData : ''
            },
            body: JSON.stringify({ count: count })
          });
        } catch (e) {
          console.error('Save failed:', e);
        }
      }, 300);
    }

    // ============================================================
    // 6. ЧАСТИЦЫ
    // ============================================================

    function spawnParticles(x, y) {
      const colors = ['#2ea6ff', '#4db8ff', '#6ab2f2', '#9ed4ff', '#c2e5ff'];
      for (let i = 0; i < 8; i++) {
        const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.5;
        const speed = 3 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 3 + Math.random() * 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1,
          decay: 0.02 + Math.random() * 0.02
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.vx *= 0.98;
        p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }
    animate();

    // ============================================================
    // 7. КЛИК
    // ============================================================

    btn.addEventListener('click', () => {
      count += currentMultiplier;
      counterEl.textContent = formatNumber(count);

      counterEl.classList.add('bump');
      setTimeout(() => counterEl.classList.remove('bump'), 150);

      const rect = btn.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      saveCount();
    });

    // ============================================================
    // 8. ВЕРХНИЕ ВКЛАДКИ
    // ============================================================

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const screenName = tab.dataset.screen;

        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + screenName).classList.add('active');

        if (screenName === 'leaderboard') loadLeaderboard();
        if (screenName === 'shop') loadThemes();

        if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      });
    });

    // ============================================================
    // 9. ПОД-ВКЛАДКИ МАГАЗИНА
    // ============================================================

    document.querySelectorAll('.shop-subtab').forEach(tab => {
      tab.addEventListener('click', () => {
        const subtab = tab.dataset.subtab;

        document.querySelectorAll('.shop-subtab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        document.getElementById('shopThemes').style.display = 'none';
        document.getElementById('shopBonuses').style.display = 'none';

        if (subtab === 'themes') {
          document.getElementById('shopThemes').style.display = 'block';
        } else if (subtab === 'bonuses') {
          document.getElementById('shopBonuses').style.display = 'block';
          loadBonuses();
        }

        if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      });
    });

    // ============================================================
    // 10. ЛИДЕРБОРД
    // ============================================================

    async function loadLeaderboard() {
      leaderboardList.innerHTML = '<div class="loading">Загрузка...</div>';

      try {
        const res = await fetch(API_URL + '/api/top', {
          headers: { 'X-Init-Data': tg ? tg.initData : '' }
        });
        const data = await res.json();

        if (!data.players || data.players.length === 0) {
          leaderboardList.innerHTML = '<div class="empty">Пока никого нет 😢</div>';
          return;
        }

        const myId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user
          ? tg.initDataUnsafe.user.id
          : null;
        const medals = ['🥇', '🥈', '🥉'];

        let html = '';
        data.players.forEach((p, i) => {
          let rankClass = '';
          if (i === 0) rankClass = 'gold';
          else if (i === 1) rankClass = 'silver';
          else if (i === 2) rankClass = 'bronze';

          const isMe = p.user_id === myId ? 'me' : '';
          const rankDisplay = i < 3 ? medals[i] : String(i + 1);

          const rawName = p.display_name || 'Игрок';
          let name = escapeHtml(rawName.charAt(0) === '@' ? rawName : '@' + rawName);
          if (p.is_premium) name += ' 💎';

          html += '<div class="leaderboard-item ' + isMe + '">';
          html += '<div class="rank ' + rankClass + '">' + rankDisplay + '</div>';
          html += '<div class="player-name">' + name + '</div>';
          html += '<div class="player-score">' + formatNumber(p.count) + ' ' + COIN + '</div>';
          html += '</div>';
        });

        leaderboardList.innerHTML = html;
      } catch (e) {
        leaderboardList.innerHTML = '<div class="empty">Ошибка загрузки 😢</div>';
        console.error(e);
      }
    }

    // ============================================================
    // 11. МАГАЗИН — ТЕМЫ
    // ============================================================

    async function loadThemes() {
      shopList.innerHTML = '<div class="loading">Загрузка...</div>';

      try {
        const res = await fetch(API_URL + '/api/themes', {
          headers: { 'X-Init-Data': tg ? tg.initData : '' }
        });
        const data = await res.json();

        if (!data.themes || data.themes.length === 0) {
          shopList.innerHTML = '<div class="empty">Магазин пуст 😢</div>';
          return;
        }

        let html = '';
        data.themes.forEach(t => {
          const isActive = t.active ? 'shop-item-active' : '';
          let btnText, btnDisabled;

          if (t.active) { btnText = '✅ Активна'; btnDisabled = true; }
          else if (t.owned) { btnText = 'Применить'; btnDisabled = false; }
          else { btnText = 'Купить'; btnDisabled = false; }

          html += '<div class="shop-item ' + isActive + '">';
          html += '<div class="shop-item-icon">' + t.icon + '</div>';
          html += '<div class="shop-item-info">';
          html += '<div class="shop-item-name">' + escapeHtml(t.name) + '</div>';
          html += '<div class="shop-item-desc">' + escapeHtml(t.desc) + '</div>';
          html += '</div>';
          if (!t.owned) {
            html += '<div class="shop-item-price">' + formatNumber(t.price) + ' ' + COIN + '</div>';
          }
          html += '<button class="shop-buy-btn" data-theme="' + t.id + '" data-owned="' + t.owned + '"' + (btnDisabled ? ' disabled' : '') + '>' + btnText + '</button>';
          html += '</div>';
        });

        shopList.innerHTML = html;

        document.querySelectorAll('.shop-buy-btn[data-theme]').forEach(btn => {
          btn.addEventListener('click', () => {
            const themeId = btn.dataset.theme;
            const owned = btn.dataset.owned === 'true';
            if (owned) activateTheme(themeId);
            else buyTheme(themeId);
          });
        });
      } catch (e) {
        shopList.innerHTML = '<div class="empty">Ошибка загрузки 😢</div>';
        console.error(e);
      }
    }

    async function buyTheme(themeId) {
      try {
        const res = await fetch(API_URL + '/api/themes/buy', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Init-Data': tg ? tg.initData : ''
          },
          body: JSON.stringify({ themeId })
        });
        const data = await res.json();

        if (data.error === 'not_enough') {
          if (tg && tg.showPopup) {
            tg.showPopup({
              title: 'Недостаточно средств',
              message: 'Нужно: ' + formatNumber(data.need) + ' ' + COIN + '\nУ тебя: ' + formatNumber(data.have) + ' ' + COIN,
              buttons: [{ type: 'close' }]
            });
          }
          return;
        }

        if (data.ok) {
          count = data.newCount !== undefined ? data.newCount : count;
          counterEl.textContent = formatNumber(count);
          applyTheme(data.theme);

          if (tg && tg.showPopup) {
            tg.showPopup({
              title: '✅ Куплено!',
              message: data.theme.name + ' активирована',
              buttons: [{ type: 'close' }]
            });
          }
          if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

          loadThemes();
        }
      } catch (e) {
        console.error('Buy theme error:', e);
      }
    }

    async function activateTheme(themeId) {
      try {
        const res = await fetch(API_URL + '/api/themes/activate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Init-Data': tg ? tg.initData : ''
          },
          body: JSON.stringify({ themeId })
        });
        const data = await res.json();

        if (data.ok) {
          applyTheme(data.theme);
          if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          loadThemes();
        }
      } catch (e) {
        console.error('Activate theme error:', e);
      }
    }

    // ============================================================
    // 12. МАГАЗИН — БОНУСЫ
    // ============================================================

    async function loadBonuses() {
      const bonusesList = document.getElementById('bonusesList');
      bonusesList.innerHTML = '<div class="loading">Загрузка...</div>';

      try {
        const res = await fetch(API_URL + '/api/bonuses', {
          headers: { 'X-Init-Data': tg ? tg.initData : '' }
        });
        const data = await res.json();

        if (!data.bonuses || data.bonuses.length === 0) {
          bonusesList.innerHTML = '<div class="empty">Бонусов пока нет 😢</div>';
          return;
        }

        let html = '';
        data.bonuses.forEach(b => {
          const isActive = b.active ? 'shop-item-active' : '';
          let btnText, btnDisabled;

          if (b.active) { btnText = '✅ Активен'; btnDisabled = true; }
          else { btnText = 'Купить'; btnDisabled = false; }

          html += '<div class="shop-item ' + isActive + '">';
          html += '<div class="shop-item-icon">' + b.icon + '</div>';
          html += '<div class="shop-item-info">';
          html += '<div class="shop-item-name">' + escapeHtml(b.name) + '</div>';
          html += '<div class="shop-item-desc">' + escapeHtml(b.desc) + '</div>';
          html += '</div>';
          html += '<div class="shop-item-price">' + formatNumber(b.price) + ' ' + COIN + '</div>';
          html += '<button class="shop-buy-btn" data-bonus="' + b.id + '"' + (btnDisabled ? ' disabled' : '') + '>' + btnText + '</button>';
          html += '</div>';
        });

        bonusesList.innerHTML = html;

        currentMultiplier = data.multiplier || 1;
        updateMultiplierBadge();

        document.querySelectorAll('[data-bonus]').forEach(btn => {
          btn.addEventListener('click', () => buyBonus(btn.dataset.bonus));
        });
      } catch (e) {
        bonusesList.innerHTML = '<div class="empty">Ошибка загрузки 😢</div>';
        console.error(e);
      }
    }

    async function buyBonus(bonusId) {
      try {
        const res = await fetch(API_URL + '/api/bonuses/buy', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Init-Data': tg ? tg.initData : ''
          },
          body: JSON.stringify({ bonusId })
        });
        const data = await res.json();

        if (data.error === 'not_enough') {
          if (tg && tg.showPopup) {
            tg.showPopup({
              title: 'Недостаточно средств',
              message: 'Нужно: ' + formatNumber(data.need) + ' ' + COIN + '\nУ тебя: ' + formatNumber(data.have) + ' ' + COIN,
              buttons: [{ type: 'close' }]
            });
          }
          return;
        }

        if (data.error === 'already_active') {
          if (tg && tg.showPopup) {
            tg.showPopup({
              title: 'Уже активно',
              message: data.message || 'Этот бонус уже действует',
              buttons: [{ type: 'close' }]
            });
          }
          return;
        }

        if (data.ok) {
          count = data.newCount;
          counterEl.textContent = formatNumber(count);

          if (bonusId === 'premium') {
            if (tg && tg.showPopup) {
              tg.showPopup({
                title: '💎 Премиум куплен!',
                message: 'Теперь рядом с твоим ником значок 💎',
                buttons: [{ type: 'close' }]
              });
            }
          } else {
            currentMultiplier = data.bonus.multiplier || 1;
            if (tg && tg.showPopup) {
              const mins = Math.round(data.bonus.duration / 60000 * 10) / 10;
              tg.showPopup({
                title: '✅ Активировано!',
                message: data.bonus.name + ' — действует ' + mins + ' мин',
                buttons: [{ type: 'close' }]
              });
            }
            startMultiplierTimer(data.expiresAt);
          }

          if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          loadBonuses();
        }
      } catch (e) {
        console.error('Buy bonus error:', e);
      }
    }

    function startMultiplierTimer(expiresAt) {
      if (multiplierTimer) clearInterval(multiplierTimer);

      const update = () => {
        const remaining = expiresAt - Date.now();
        if (remaining <= 0) {
          currentMultiplier = 1;
          updateMultiplierBadge();
          clearInterval(multiplierTimer);
          multiplierTimer = null;
          return;
        }
        updateMultiplierBadge(remaining);
      };

      update();
      multiplierTimer = setInterval(update, 1000);
    }

    function updateMultiplierBadge(remaining) {
      let badge = document.getElementById('multiplierBadge');

      if (currentMultiplier <= 1) {
        if (badge) badge.remove();
        return;
      }

      if (!badge) {
        badge = document.createElement('div');
        badge.id = 'multiplierBadge';
        badge.className = 'multiplier-badge';
        const container = document.querySelector('#screen-clicker .container');
        container.appendChild(badge);
      }

      let text = '⚡ x' + currentMultiplier;
      if (remaining && remaining > 0) {
        const sec = Math.ceil(remaining / 1000);
        text += ' · ' + sec + 'с';
      }
      badge.textContent = text;
    }

    // ============================================================
    // 13. ПРОМОКОДЫ
    // ============================================================

    const promoBtn = document.getElementById('promoBtn');
    const promoInput = document.getElementById('promoInput');

    if (promoBtn) {
      promoBtn.addEventListener('click', activatePromo);
      promoInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') activatePromo();
      });
    }

    async function activatePromo() {
      const code = (promoInput.value || '').trim().toUpperCase();

      if (!code) {
        if (tg && tg.showAlert) tg.showAlert('Введи промокод');
        return;
      }

      promoBtn.disabled = true;
      promoBtn.textContent = '...';

      try {
        const res = await fetch(API_URL + '/api/promo', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Init-Data': tg ? tg.initData : ''
          },
          body: JSON.stringify({ code })
        });
        const data = await res.json();

        if (data.ok) {
          count = data.newCount;
          counterEl.textContent = formatNumber(count);
          promoInput.value = '';

          if (tg && tg.showPopup) {
            tg.showPopup({
              title: '🎁 Промокод активирован!',
              message: '+' + formatNumber(data.reward) + ' ' + COIN,
              buttons: [{ type: 'close' }]
            });
          }
          if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        } else {
          if (tg && tg.showAlert) tg.showAlert(data.message || 'Ошибка');
        }
      } catch (e) {
        console.error('Promo error:', e);
        if (tg && tg.showAlert) tg.showAlert('Ошибка сети');
      } finally {
        promoBtn.disabled = false;
        promoBtn.textContent = 'Активировать';
      }
    }

    // ============================================================
    // 14. НИЖНЯЯ НАВИГАЦИЯ
    // ============================================================

    document.getElementById('donateBtn').addEventListener('click', () => {
      if (tg && tg.openTelegramLink) tg.openTelegramLink(DONATE_URL);
      else if (tg && tg.openLink) tg.openLink(DONATE_URL);
      else window.open(DONATE_URL, '_blank');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    document.getElementById('channelBtn').addEventListener('click', () => {
      if (tg && tg.openTelegramLink) tg.openTelegramLink(CHANNEL_URL);
      else window.open(CHANNEL_URL, '_blank');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    document.getElementById('infoBtn').addEventListener('click', () => {
      if (tg && tg.showPopup) {
        tg.showPopup({
          title: 'О боте',
          message: 'BasicClickBot — кликер с лидербордом.\n\n' +
                   '🎯 Жми кнопку, чтобы заработать ' + COIN + '\n' +
                   '🛒 Покупай темы и бонусы\n' +
                   '🏆 Соревнуйся в рейтинге\n' +
                   '💎 Купи Премиум\n' +
                   '🎁 Активируй промокоды\n\n' +
                   'Версия 2.0',
          buttons: [{ type: 'close' }]
        });
      } else {
        alert('BasicClickBot — кликер. Версия 2.0');
      }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    // ============================================================
    // 15. СТАРТ
    // ============================================================

    loadCount();
  </script>
</body>
</html>
